<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Visita Digital | Corretor de Imóveis de Luxo</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            color: #ffffff;
        }

        /* Overlay escuro para contraste */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .container.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* Topo / Perfil */
        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-img-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #D4AF37, #FFF5C0);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #111;
        }

        .profile-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .profile-header h2 {
            font-size: 0.85rem;
            font-weight: 500;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .bio-text {
            font-size: 0.85rem;
            color: #e0e0e0;
            font-weight: 300;
            line-height: 1.4;
            max-width: 90%;
            margin: 0 auto;
        }

        /* Grid de Ações Rápidas */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 15px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .action-btn i {
            font-size: 1.1rem;
            color: #D4AF37;
        }

        .action-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #D4AF37;
            transform: scale(1.03);
        }

        /* Botão de Destaque / Salvar Contato */
        .save-contact-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #D4AF37, #AA7C11);
            color: #000000;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .save-contact-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #E5C158, #C49216);
        }

        /* Destaque de Imóvel */
        .property-highlight {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 25px;
            transition: transform 0.3s ease;
        }

        .property-highlight:hover {
            transform: scale(1.01);
        }

        .property-badge {
            background: #D4AF37;
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            position: absolute;
            top: 10px;
            left: 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .property-img-container {
            position: relative;
            width: 100%;
            height: 140px;
        }

        .property-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .property-info {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .property-details h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
        }

        .property-details p {
            font-size: 0.8rem;
            color: #D4AF37;
            font-weight: 500;
        }

        .property-btn {
            background: transparent;
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .property-btn:hover {
            background: #D4AF37;
            color: #000;
        }

        /* Rodapé */
        .footer {
            text-align: center;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .social-icons a {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: #D4AF37;
            color: #000000;
            border-color: #D4AF37;
            transform: scale(1.1);
        }

        .copyright {
            font-size: 0.7rem;
            color: #888888;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container" id="cardContainer">
        <!-- Topo / Perfil -->
        <div class="profile-header">
            <div class="profile-img-container">
                <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=300&auto=format&fit=crop" alt="Foto do Corretor" class="profile-img">
            </div>
            <h1>Arthur Vance</h1>
            <h2>Corretor de Imóveis de Luxo</h2>
            <p class="bio-text">Transformando sonhos em endereços exclusivos.</p>
        </div>

        <!-- Botões de Ação Rápida -->
        <div class="action-grid">
            <a href="https://wa.me/5511999999999" target="_blank" class="action-btn">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
            <a href="https://waze.com/ul" target="_blank" class="action-btn">
                <i class="fa-solid fa-location-dot"></i> Localização
            </a>
            <a href="mailto:contato@arthurvance.com" class="action-btn">
                <i class="fa-solid fa-envelope"></i> E-mail
            </a>
            <a href="https://example.com" target="_blank" class="action-btn">
                <i class="fa-solid fa-globe"></i> Portfólio
            </a>
        </div>

        <!-- Botão de Destaque: Salvar Contato -->
        <a href="#" id="saveContactBtn" class="save-contact-btn">
            <i class="fa-solid fa-user-plus"></i> Salvar na Agenda
        </a>

        <!-- Destaque de Imóvel -->
        <div class="property-highlight">
            <div class="property-img-container">
                <span class="property-badge">Oportunidade do Mês</span>
                <img src="https://images.unsplash.com/photo-1613977257363-707ba9348227?q=80&w=600&auto=format&fit=crop" alt="Mansão de Luxo" class="property-img">
            </div>
            <div class="property-info">
                <div class="property-details">
                    <h3>Mansão Alphaville</h3>
                    <p>R$ 12.500.000</p>
                </div>
                <a href="#detalhes" class="property-btn">Ver Detalhes</a>
            </div>
        </div>

        <!-- Rodapé -->
        <footer class="footer">
            <div class="social-icons">
                <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://linkedin.com" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
            </div>
            <p class="copyright">&copy; 2026 Arthur Vance. Todos os direitos reservados.</p>
        </footer>
    </div>

    <!-- JavaScript Básico -->
    <script>
        // Animação de Fade In ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('cardContainer');
            setTimeout(() => {
                container.classList.add('fade-in');
            }, 150);
        });

        // Simulação da função vCard para o botão "Salvar na Agenda"
        document.getElementById('saveContactBtn').addEventListener('click', (e) => {
            e.preventDefault();
            
            const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:Arthur Vance
TITLE:Corretor de Imóveis de Luxo
TEL;TYPE=WORK,VOICE:+5511999999999
EMAIL:contato@arthurvance.com
URL:https://example.com
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Arthur_Vance_Corretor.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Feedback simples
            alert('Contato baixado com sucesso! Abra o arquivo para salvá-lo na sua agenda.');
        });
    </script>
</body>
</html>
